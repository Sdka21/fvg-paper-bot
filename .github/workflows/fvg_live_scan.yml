name: FVG live paper scanner

on:
  push:
    branches: [main]
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

concurrency:
  group: fvg-live-scanner
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan all Binance USDT spot markets
        run: |
          mkdir -p reports
          python fvg_bot.py scan --all-coins --quote USDT --days 7 2>&1 | tee reports/latest_scan.txt

      - name: Publish scan report
        uses: actions/upload-artifact@v4
        with:
          name: fvg-scan-${{ github.run_id }}
          path: reports/latest_scan.txt
          retention-days: 7
