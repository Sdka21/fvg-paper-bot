name: ICT quick scalp long-only spot paper trader

on:
  push:
    branches: [main]
    paths:
      - "scalp_paper_trader.py"
      - "paper_trader.py"
      - ".github/workflows/ict_paper_trader.yml"
      - "fvg_bot.py"
      - "requirements.txt"
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

concurrency:
  group: ict-paper-trader
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quick scalp paper cycle
        run: |
          mkdir -p reports
          python scalp_paper_trader.py --all-coins --quote USDT --days 2 --max-open-positions 9 --capital-deployment 0.90 2>&1 | tee reports/scalp_paper_cycle.txt

      - name: Publish scalp cycle
        uses: actions/upload-artifact@v4
        with:
          name: ict-scalp-paper-${{ github.run_id }}
          path: |
            reports/scalp_paper_cycle.txt
            reports/scalp_state.json
            reports/scalp_trades.csv
            reports/scalp_equity.csv
          retention-days: 14

      - name: Publish scalp state for dashboard
        run: |
          cp reports/scalp_state.json reports/paper_state.json
          cp reports/scalp_trades.csv reports/paper_trades.csv
          cp reports/scalp_equity.csv reports/paper_equity.csv

      - name: Persist paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/scalp_state.json reports/scalp_trades.csv reports/scalp_equity.csv reports/paper_state.json reports/paper_trades.csv reports/paper_equity.csv
          if git diff --cached --quiet; then
            echo "No paper-state changes to commit."
          else
            git commit -m "chore: persist ICT scalp paper state"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build dashboard site
        run: |
          rm -rf dashboard-site
          mkdir -p dashboard-site/data
          cp dashboard/index.html dashboard-site/index.html
          cp reports/scalp_state.json dashboard-site/data/paper_state.json
          cp reports/scalp_equity.csv dashboard-site/data/paper_equity.csv
          cp reports/scalp_trades.csv dashboard-site/data/paper_trades.csv

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
