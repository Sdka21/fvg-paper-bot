name: ICT long-only spot paper trader

on:
  push:
    branches: [main]
    paths:
      - "paper_trader.py"
      - ".github/workflows/ict_paper_trader.yml"
      - "fvg_bot.py"
      - "requirements.txt"
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

concurrency:
  group: ict-paper-trader
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run persistent ICT paper cycle
        run: |
          mkdir -p reports
          python paper_trader.py --all-coins --quote USDT --days 7 2>&1 | tee reports/ict_paper_cycle.txt

      - name: Publish paper cycle
        uses: actions/upload-artifact@v4
        with:
          name: ict-paper-${{ github.run_id }}
          path: |
            reports/ict_paper_cycle.txt
            reports/paper_state.json
            reports/paper_trades.csv
            reports/paper_equity.csv
          retention-days: 14

      - name: Persist paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/paper_state.json reports/paper_trades.csv reports/paper_equity.csv
          if git diff --cached --quiet; then
            echo "No paper-state changes to commit."
          else
            git commit -m "chore: persist ICT paper state"
            git push
          fi
