name: ICT quick scalp long-only spot paper trader

on:
  # Deliberately do not trigger on the workflow's own state commit.
  # State is advanced by the scheduled/manual paper cycles below.
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

concurrency:
  group: ict-paper-trader-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quick scalp paper cycle
        env:
          BINANCE_PUBLIC_API_BASE: https://data-api.binance.vision/api/v3
        run: |
          set -o pipefail
          mkdir -p reports
          python scalp_regime_runner.py \
            --all-coins \
            --quote USDT \
            --days 2 \
            --max-open-positions 9 \
            --capital-deployment 0.90 \
            2>&1 | tee reports/scalp_paper_cycle.txt

      - name: Validate generated paper reports
        run: |
          set -euo pipefail
          for f in reports/scalp_state.json reports/scalp_trades.csv reports/scalp_equity.csv; do
            test -s "$f" || { echo "Missing or empty report: $f"; exit 1; }
          done
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("reports/scalp_state.json").read_text())
          required = ["equity", "cash", "open_positions", "trades", "equity_curve", "data_status", "last_prices"]
          missing = [k for k in required if k not in state]
          if missing:
              raise SystemExit(f"Invalid scalp state; missing keys: {missing}")

          print(
              "Paper state:",
              f"status={state.get('data_status')}",
              f"equity={state.get('equity')}",
              f"open_positions={len(state.get('open_positions', []))}",
              f"closed_trades={len(state.get('trades', []))}",
          )
          print(
              "Market coverage:",
              f"scanned={state.get('symbols_scanned')}",
              f"with_data={state.get('symbols_with_data')}",
              f"eligible_new_entries={state.get('eligible_new_entry_symbols')}",
              f"errors={len(state.get('scan_errors', {}))}",
          )
          if state.get("last_error"):
              print("Last data error:", state["last_error"])
          PY

      - name: Publish scalp cycle
        uses: actions/upload-artifact@v4
        with:
          name: ict-scalp-paper-${{ github.run_id }}
          path: |
            reports/scalp_paper_cycle.txt
            reports/scalp_state.json
            reports/scalp_trades.csv
            reports/scalp_equity.csv
          if-no-files-found: error
          retention-days: 14

      - name: Publish scalp state for dashboard
        run: |
          set -euo pipefail
          cp reports/scalp_state.json reports/paper_state.json
          cp reports/scalp_trades.csv reports/paper_trades.csv
          cp reports/scalp_equity.csv reports/paper_equity.csv
          test -s reports/paper_state.json
          test -s reports/paper_trades.csv
          test -s reports/paper_equity.csv

      - name: Persist paper state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            reports/scalp_state.json \
            reports/scalp_trades.csv \
            reports/scalp_equity.csv \
            reports/paper_state.json \
            reports/paper_trades.csv \
            reports/paper_equity.csv
          if git diff --cached --quiet; then
            echo "No paper-state changes to commit."
          else
            git commit -m "chore: persist ICT scalp paper state"
            # Another state commit can land between checkout and push. Rebase
            # our report-only commit onto the newest main and retry safely.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push paper state after $attempt attempts."
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build dashboard site
        run: |
          set -euo pipefail
          rm -rf dashboard-site
          mkdir -p dashboard-site/data
          cp dashboard/index.html dashboard-site/index.html
          cp reports/paper_state.json dashboard-site/data/paper_state.json
          cp reports/paper_equity.csv dashboard-site/data/paper_equity.csv
          cp reports/paper_trades.csv dashboard-site/data/paper_trades.csv

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard-site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
